<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bai1</title>
    <style>
        #box1 {
            width: 100px;
            height: 100px;
            background-color: transparent;
            border: 5px solid #f14c4c;
        }

        #box2 {
            width: 200px;
            height: 100px;
            background-color: transparent;
            border: 5px solid cornflowerblue;
        }
        #box3 {
            border-style: solid;
            border-color: transparent transparent lightgreen transparent;
            border-width: 20px 40px 80px 40px;
            width: 1px;
        }
        #box4 {
            border-style: solid;
            border-color: orange transparent transparent transparent;
            border-width: 80px 40px 20px 40px;
            width: 1px;
        }
        #box5 {
            border-style: solid;
            border-color: transparent rebeccapurple transparent transparent;
            border-width: 40px 80px 40px 20px;
            width: 1px;
        }
        #box6 {
            border-style: solid;
            border-color: transparent transparent transparent darkorange;
            border-width: 40px 20px 40px 80px;
            width: 1px;
        }
        #box7 {
            border-style: solid;
            border-color: transparent transparent mediumseagreen transparent;
            border-width: 30px 20px 70px 20px;
            width: 100px;
        }
        #box8 {
            border-style: solid;
            width: 1px;
            border-color: transparent transparent dimgrey transparent;
            border-width: 100px 100px 50px 100px;
        }
        #box9 {
            border-style: solid;
            width: 1px;
            border-color: transparent transparent darkred transparent;
            border-width: 100px 50px 200px 50px;
        }
        #box10 {
            border-style: solid;
            width: 1px;
            border-color: transparent transparent darkgoldenrod transparent;
            border-width: 100px 100px 100px 100px;
        }
        #box11 {
            border-style: solid;
            width: 1px;
            border-color: transparent transparent transparent cadetblue;
            border-width: 50px 50px 50px 100px;
        }
        #box12 {
            border-style: solid;
            width: 1px;
            border-color: transparent purple transparent transparent;
            border-width: 50px 100px 50px 50px;
        }
        #box13 {
            border-style: solid;
            width: 1px;
            border-color: indianred transparent indianred indianred;
            border-width: 50px 50px 50px 125px;
        }
        #box-F{
            position: relative;
            width: 150px;
            height: 200px;
            display: inline-block;
        }
        #box-F .F-top{
            position: absolute;
            width: 100px;
            height: 25px;
            top: 0;
            left: 0;
            background-color: indianred;
        }
        #box-F .F-middle{
            position: absolute;
            width:  100px;
            height: 25px;
            top: 86px;
            left: 0;
            background-color: indianred;
        }
        #box-F .F-vertical{
            position: absolute;
            width: 25px;
            height: 200px;
            top: 0;
            left: 0;
            background-color: indianred;
        }
        #box-eight {
            position: relative;
            width: 150px;
            height: 200px;
            display: inline-block;
            margin-left: -15px;
        }
        #box-eight .eight-top{
            position: absolute;
            background-color: indianred;
            width: 125px;
            height: 25px;
            top: 0;
            left: 0;
        }
        #box-eight .eight-bottom{
            position: absolute;
            background-color: indianred;
            width: 125px;
            height: 25px;
            top: 175px;
            left: 0;
        }
        #box-eight .eight-middle{
            position: absolute;
            background-color: indianred;
            width: 125px;
            height: 25px;
            top: 86px;
            left: 0;
        }
        #box-eight .eight-left{
            position: absolute;
            background-color: indianred;
            width: 25px;
            height: 200px;
            top: 0;
            left: 0;
        }
        #box-eight .eight-right{
            position: absolute;
            background-color: indianred;
            width: 25px;
            height: 200px;
            top: 0;
            left: 100px;
        }
        .box {
            display: inline-block;
            margin: 10px;
        }
    </style>
</head>
<body>
<div class="box" id="box1"></div>
<div class="box" id="box2"></div>
<div class="box" id="box3"></div>
<div class="box" id="box4"></div>
<div class="box" id="box5"></div>
<div class="box" id="box6"></div>
<div class="box" id="box7"></div>
<div class="box" id="box8"></div>
<div class="box" id="box9"></div>
<div class="box" id="box10"></div>
<div class="box" id="box11"></div>
<div class="box" id="box12"></div>
<div class="box" id="box13"></div>
<div id="box14">
    <div id="box-F">
        <div class="F-top"></div>
        <div class="F-middle"></div>
        <div class="F-vertical"></div>
    </div>
    <div id="box-eight">
        <div class="eight-top"></div>
        <div class="eight-right"></div>
        <div class="eight-bottom"></div>
        <div class="eight-left"></div>
        <div class="eight-middle"></div>
    </div>
</div>
</body>
</html>
